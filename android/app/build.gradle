plugins { id 'com.android.application' }

// Signature : clé fixe fournie par les secrets GitHub (KEYSTORE_FILE, KEYSTORE_PASS) pour que chaque
// nouvelle version s'installe par-dessus la précédente. Le flux de fabrication refuse de publier sans elle.
def cle = System.getenv('KEYSTORE_FILE')

// Numéro de version (07/11/2026, schéma d'Impulsion) : « 3.0 » (fichier VERSION, tenu à la main) suivi du numéro de
// fabrication d'Actions, par exemple 3.0.50. La fabrication sert aussi de versionCode (mise à jour) : elle ne fait que croître.
def fabrication = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def base = rootProject.file('VERSION').text.trim()

android {
    namespace 'io.github.officiouslabs.compagnon'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.officiouslabs.compagnon'
        minSdk 26
        targetSdk 34
        versionCode fabrication
        versionName "${base}.${fabrication}"
    }
    signingConfigs {
        if (cle) {
            fixe {
                storeFile file(cle)
                storeType 'pkcs12'
                enableV1Signing true
                enableV2Signing true
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'compagnon'
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig cle ? signingConfigs.fixe : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // retirer l'en-tête X-Requested-With dans la page de connexion
    implementation 'androidx.webkit:webkit:1.8.0'
}
