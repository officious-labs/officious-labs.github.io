<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Impulsion · Bulletins</title>
<!--
  Le carrefour du PC, première pièce (23/11/2026) : les appréciations des bulletins, à copier dans iMuse, par lieu
  ou par étiquette. En lecture seule : les retouches se font au téléphone. Elle lit les notes dans le pCloud
  d'Amandine (le dossier de l'appli seulement), avec un jeton gardé dans ce navigateur ; rien ne part ailleurs.
  La période d'un élève suit la règle de l'appli (Bulletins.periode) : une appréciation de moins de 45 jours est
  celle du bulletin en cours ; pour Traditionnel, celle de l'année scolaire.
  Publiée par appli/page/publier.py ; ne pas la modifier dans le dépôt du site.
-->
<style>
  :root { --encre: #1c1c1e; --gris: #6b6b70; --fond: #f4f4f6; --carte: #fff; --pastille: #ececf0; --accent: #3b2a6b; --sur-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --encre: #f2f2f4; --gris: #a1a1a8; --fond: #121214; --carte: #1e1e22; --pastille: #2a2a30; --accent: #c9b8ff; --sur-accent: #121214; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.8rem; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 28px 0 8px; }
  .gris { color: var(--gris); }
  .puces { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 18px; padding: 7px 14px; background: var(--pastille); color: var(--encre); }
  button.actif, button.plein { background: var(--accent); color: var(--sur-accent); }
  button.plein { font-weight: 600; padding: 9px 18px; }
  .carte { background: var(--carte); border-radius: 14px; padding: 12px 16px; margin: 8px 0; }
  .eleve { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .nom { font-weight: 600; }
  .texte { margin: 6px 0 8px; white-space: pre-wrap; }
  .barre { display: flex; gap: 8px; align-items: center; }
  .bas { display: flex; gap: 12px; margin-top: 32px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Bulletins</h1>
  <p id="etat" class="gris">Chargement…</p>
  <div id="connexion" hidden>
    <p>Pour lire tes notes, la page a besoin de ton accord dans pCloud, une seule fois sur cet ordinateur.</p>
    <button class="plein" id="connecter">Se connecter à pCloud</button>
  </div>
  <div id="vue" hidden>
    <div class="puces" id="lieux"></div>
    <div class="puces" id="etiquettes"></div>
    <div class="barre"><button class="plein" id="copierTout">Copier tout ce qui est affiché</button></div>
    <div id="liste"></div>
    <div class="bas">
      <button id="actualiser">Relire les notes</button>
      <button id="deconnecter">Se déconnecter</button>
    </div>
  </div>
</main>
<script>
"use strict";
var CLIENT_ID = "3pPKpHNiLC5";
var CLOTURE_JOURS = 45;
var MOIS = ["janv", "fevr", "mars", "avr", "mai", "juin", "juil", "aout", "sept", "oct", "nov", "dec"];
var IGNORES = ["Bulletins", "Sons"];
var STOCKAGE = "impulsion-carrefour";

function $(id) { return document.getElementById(id); }
function sansAccents(s) { return s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().trim(); }
function memes(a, b) { return sansAccents(a) === sansAccents(b); }
function etat(t) { $("etat").textContent = t; $("etat").hidden = !t; }

// —— Connexion (« implicit grant » : pas de secret dans la page, qui est publique) ——
function lireJeton() { try { return JSON.parse(localStorage.getItem(STOCKAGE) || "null"); } catch (e) { return null; } }
function retourPcloud() {
  if (!location.hash) return;
  var p = new URLSearchParams(location.hash.substring(1));
  history.replaceState(null, "", location.pathname);
  if (p.get("state") !== sessionStorage.getItem(STOCKAGE + "-etat")) return;
  var serveur = p.get("hostname");
  if (["api.pcloud.com", "eapi.pcloud.com"].indexOf(serveur) < 0) serveur = p.get("locationid") === "1" ? "api.pcloud.com" : "eapi.pcloud.com";
  if (p.get("access_token")) localStorage.setItem(STOCKAGE, JSON.stringify({ jeton: p.get("access_token"), serveur: serveur }));
}
function connecter() {
  var e = crypto.getRandomValues(new Uint32Array(4)).join("-");
  sessionStorage.setItem(STOCKAGE + "-etat", e);
  location.href = "https://my.pcloud.com/oauth2/authorize?" + new URLSearchParams({
    client_id: CLIENT_ID, response_type: "token", redirect_uri: location.origin + location.pathname, state: e });
}

function appel(c, methode, params) {
  var q = new URLSearchParams(Object.assign({}, params, { access_token: c.jeton }));
  return fetch("https://" + c.serveur + "/" + methode + "?" + q).then(function (r) { return r.json(); }).then(function (j) {
    if (j.result !== 0) { var err = new Error(j.error || "erreur " + j.result); err.code = j.result; throw err; }
    return j;
  });
}
function lireFichier(c, id) {
  return appel(c, "getfilelink", { fileid: id }).then(function (l) {
    return fetch("https://" + l.hosts[0] + l.path).then(function (r) { return r.text(); });
  });
}

// —— Les notes ——
function fichiers(m, chemin, dest) {
  (m.contents || []).forEach(function (e) {
    var c = chemin.concat([e.name]);
    if (e.isfolder) { if (!(chemin.length === 0 && IGNORES.indexOf(e.name) >= 0)) fichiers(e, c, dest); }
    else if (/\.md$/i.test(e.name)) dest.push({ id: e.fileid, chemin: c });
  });
  return dest;
}
function lireDate(s, ref) {
  var r = /^(\d{1,2})(?:er)?\s+(\p{L}+)\.?(?:\s+(\d{4}))?$/u.exec(s.trim());
  if (!r) return null;
  var m = MOIS.findIndex(function (x) { return sansAccents(r[2]).indexOf(x) === 0; });
  if (m < 0) return null;
  return new Date(r[3] ? +r[3] : ref.getFullYear(), m, +r[1]);
}
/** Une note : ses sections d'élèves (celles qui portent un genre), chacune avec ses étiquettes et ses appréciations. */
function lireNote(texte, ref) {
  var eleves = [], courant = null;
  texte.split(/\r?\n/).forEach(function (l) {
    var t = l.trim();
    if (/^##\s/.test(t)) {
      var r = /^##\s+(.+?)\s*\(([^()]*)\)\s*$/.exec(t);
      var parts = r ? r[2].split(",").map(function (x) { return x.trim(); }) : [];
      var genre = parts.length && ["fille", "f", "garçon", "garcon", "g"].indexOf(parts[0].toLowerCase()) >= 0;
      courant = genre ? { nom: r[1], etiquettes: parts.slice(1).filter(Boolean), appreciations: [] } : null;
      if (courant) eleves.push(courant);
    } else if (/^#\s/.test(t)) courant = null;
    else if (courant) {
      var a = /^-\s+\[appr[ée]ciation(?:\s+retouch[ée]e)?]\s*(.*)$/i.exec(t);
      if (!a) return;
      var i = a[1].indexOf(" : ");
      var d = i > 0 ? lireDate(a[1].substring(0, i), ref) : null;
      if (d) courant.appreciations.push({ date: d, texte: a[1].substring(i + 3).trim() });
    }
  });
  return eleves;
}
function rentree(d) { return new Date(d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1, 8, 1); }
/** L'appréciation du bulletin en cours, comme Bulletins.periode et Bulletins.retenue de l'appli. */
function enCours(e, jour) {
  var trad = e.etiquettes.some(function (x) { return memes(x, "Traditionnel"); });
  var limite = trad ? rentree(jour) : new Date(jour.getFullYear(), jour.getMonth(), jour.getDate() - CLOTURE_JOURS + 1);
  if (!trad && limite < rentree(jour)) limite = rentree(jour);
  var a = e.appreciations.filter(function (x) { return x.date >= limite && x.date <= jour; });
  return a.length ? a[a.length - 1].texte : null;
}
/** Pour iMuse : le texte sans marques de mise en forme, espaces insécables ordinaires (iMuse n'en tient pas compte). */
function pourImuse(t) {
  return t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").replace(/==(.+?)==/g, "$1").replace(/\+\+(.+?)\+\+/g, "$1")
    .replace(/[  ]/g, " ").trim();
}

// —— L'écran ——
var classes = [], choixLieu = null, choixEtiquette = null;
var copiees = JSON.parse(localStorage.getItem(STOCKAGE + "-copiees") || "{}");

function puce(texte, actif, f) {
  var b = document.createElement("button"); b.textContent = texte; if (actif) b.className = "actif"; b.onclick = f; return b;
}
function visibles() {
  return classes.filter(function (c) { return !choixLieu || memes(c.lieu, choixLieu); }).map(function (c) {
    return { classe: c, eleves: c.eleves.filter(function (e) { return !choixEtiquette || e.etiquettes.some(function (x) { return memes(x, choixEtiquette); }); }) };
  }).filter(function (v) { return v.eleves.length; });
}
function copier(texte, cle, bouton) {
  navigator.clipboard.writeText(texte).then(function () {
    if (cle) { copiees[cle] = texte; localStorage.setItem(STOCKAGE + "-copiees", JSON.stringify(copiees)); }
    if (bouton) bouton.textContent = "✓ Copié";
  });
}
function afficher() {
  var lieux = [], etiquettes = [];
  classes.forEach(function (c) {
    if (!lieux.some(function (l) { return memes(l, c.lieu); })) lieux.push(c.lieu);
    c.eleves.forEach(function (e) { e.etiquettes.forEach(function (x) {
      if (!memes(x, "Adulte") && !etiquettes.some(function (y) { return memes(x, y); })) etiquettes.push(x);
    }); });
  });
  var l = $("lieux"); l.textContent = "";
  l.appendChild(puce("Tous les lieux", !choixLieu, function () { choixLieu = null; afficher(); }));
  lieux.forEach(function (x) { l.appendChild(puce(x, choixLieu === x, function () { choixLieu = x; afficher(); })); });
  var t = $("etiquettes"); t.textContent = "";
  if (etiquettes.length) {
    t.appendChild(puce("Tous les élèves", !choixEtiquette, function () { choixEtiquette = null; afficher(); }));
    etiquettes.forEach(function (x) { t.appendChild(puce(x, choixEtiquette === x, function () { choixEtiquette = x; afficher(); })); });
  }
  var liste = $("liste"); liste.textContent = "";
  var tout = [];
  visibles().forEach(function (v) {
    var h = document.createElement("h2"); h.textContent = v.classe.titre;
    var sous = document.createElement("span"); sous.className = "gris"; sous.textContent = " · " + v.classe.lieu; h.appendChild(sous);
    liste.appendChild(h);
    var bloc = [];
    v.eleves.forEach(function (e) {
      var texte = e.texte ? pourImuse(e.texte) : null;
      var carte = document.createElement("div"); carte.className = "carte";
      var haut = document.createElement("div"); haut.className = "eleve";
      var nom = document.createElement("span"); nom.className = "nom"; nom.textContent = e.nom; haut.appendChild(nom);
      carte.appendChild(haut);
      var p = document.createElement("div"); p.className = texte ? "texte" : "texte gris";
      p.textContent = texte || "Pas encore de texte.";
      carte.appendChild(p);
      if (texte) {
        var cle = v.classe.chemin + " | " + e.nom;
        var b = document.createElement("button"); b.className = "plein";
        b.textContent = copiees[cle] === texte ? "✓ Copié" : "Copier";
        b.onclick = function () { copier(texte, cle, b); };
        carte.appendChild(b);
        bloc.push(e.nom + "\n" + texte);
      }
      liste.appendChild(carte);
    });
    if (bloc.length) tout.push(v.classe.titre + "\n\n" + bloc.join("\n\n"));
  });
  if (!liste.childNodes.length) { var vide = document.createElement("p"); vide.className = "gris"; vide.textContent = "Aucun élève ici."; liste.appendChild(vide); }
  $("copierTout").hidden = !tout.length;
  $("copierTout").textContent = "Copier tout ce qui est affiché";
  $("copierTout").onclick = function () { copier(tout.join("\n\n\n"), null, $("copierTout")); };
}

function charger() {
  var c = lireJeton();
  if (!c) { etat(""); $("connexion").hidden = false; $("vue").hidden = true; return; }
  $("connexion").hidden = true;
  etat("Lecture des notes…");
  var jour = new Date(); jour = new Date(jour.getFullYear(), jour.getMonth(), jour.getDate());
  appel(c, "listfolder", { folderid: 0, recursive: 1 }).then(function (j) {
    var fs = fichiers(j.metadata, [], []).filter(function (f) {
      return f.chemin.length > 1 && !f.chemin.some(function (x) { return /^(coordination|handicap|archives)$/.test(sansAccents(x)); });
    });
    var lus = [], i = 0;
    function suivant() {
      if (i >= fs.length) return Promise.resolve();
      var f = fs[i++];
      return lireFichier(c, f.id).then(function (t) { lus.push({ f: f, eleves: lireNote(t, jour) }); }).then(suivant);
    }
    // Quatre lectures à la fois : assez vite, sans trop solliciter pCloud.
    return Promise.all([suivant(), suivant(), suivant(), suivant()]).then(function () {
      classes = lus.filter(function (x) { return x.eleves.length; }).map(function (x) {
        return { lieu: x.f.chemin[0], titre: x.f.chemin[x.f.chemin.length - 1].replace(/\.md$/i, ""), chemin: x.f.chemin.join("/"),
                 eleves: x.eleves.map(function (e) { return { nom: e.nom, etiquettes: e.etiquettes, texte: enCours(e, jour) }; }) };
      }).sort(function (a, b) { return a.lieu.localeCompare(b.lieu, "fr") || a.titre.localeCompare(b.titre, "fr", { numeric: true }); });
      etat(""); $("vue").hidden = false; afficher();
    });
  }).catch(function (e) {
    if (e.code === 1000 || e.code === 2094 || e.code === 2095) { localStorage.removeItem(STOCKAGE); charger(); return; }
    etat("Les notes n’ont pas pu être lues (" + e.message + "). Réessayer avec « Relire les notes ».");
    $("vue").hidden = false;
  });
}

$("connecter").onclick = connecter;
$("actualiser").onclick = charger;
$("deconnecter").onclick = function () { localStorage.removeItem(STOCKAGE); localStorage.removeItem(STOCKAGE + "-copiees"); classes = []; charger(); };
retourPcloud();
charger();
</script>
</body>
</html>
